name = "sweetsourcefarmstead"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./web/dist"

# Runtime vars, readable from Functions via c.env.
# Secrets (RESEND_API_KEY) do NOT belong here — set those in the Pages
# dashboard or with `wrangler pages secret put`, so they stay out of git.
[vars]
FROM_EMAIL = "Sweet Source Farmstead <noreply@sweetsourcefarmstead.com>"
NOTIFY_EMAIL = "sweetsourcefarmstead919@gmail.com"
ADMIN_USER = "admin"

[[d1_databases]]
binding = "DB"
database_name = "ssf-db"
database_id = "fe4cb851-e9cc-4091-aee5-7a4f945f86fc"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ssf-assets"

# Named environments do NOT inherit the top-level [vars], so these have to be
# repeated here or preview deploys silently lose them.
[env.preview]
[env.preview.vars]
FROM_EMAIL = "Sweet Source Farmstead <noreply@sweetsourcefarmstead.com>"
NOTIFY_EMAIL = "srallen@gmail.com"
ADMIN_USER = "admin"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ssf-db-dev"
database_id = "bf4719c4-4bfb-4674-a458-7ed1124e170d"

[[env.preview.r2_buckets]]
binding = "FILES"
bucket_name = "ssf-assets"
